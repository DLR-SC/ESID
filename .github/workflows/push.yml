name: Push

on: ['push']

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup
        run: npm install

      - name: Formatting
        run: npx prettier --check .

      - name: Linting
        run: npx eslint src

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
      - name: Upload Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/vitest-junit.xml

      - name: Coverage
        run: npm run coverage
      - name: Upload Coverage
        uses: coverallsapp/github-action@v2.2.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: reports/clover.xml
          format: clover

  lighthouseci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install && npm install -g @lhci/cli@0.14.x
          npm run build
      - run: lhci autorun --collect.psiStrategy=desktop --upload.target=temporary-public-storage
    env:
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LIGHTHOUSE_CI }}

  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  reuse:
    name: Check Compliance with REUSE Specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v1
